<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Orçamentos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { margin-bottom: 20px; background: #eee; padding: 10px; }
        nav a { margin-right: 15px; text-decoration: none; font-weight: bold; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn { padding: 5px 10px; text-decoration: none; color: white; background: #007bff; border-radius: 3px; }
        .btn-danger { background: #dc3545; }
        .btn-success { background: #28a745; }
        @media print { nav, .no-print { display: none; } }
    </style>
</head>
<body>
    <nav class="no-print">
        <a href="{% url 'lista_produtos' %}">Produtos</a>
        <a href="{% url 'lista_orcamentos' %}">Orçamentos</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
